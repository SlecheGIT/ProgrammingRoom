services:
  # Serviço do Banco de Dados
  db:
    image: postgres:16-alpine
    container_name: programmingroom_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
      POSTGRES_DB: ${DB_NAME:-programmingroom_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - pr_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-programmingroom_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Interface web para o Banco de Dados (pgAdmin)
  pgadmin:
    image: dpage/pgadmin4
    container_name: programmingroom_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - pr_network
    depends_on:
      - db

  # Serviço do Backend (Node.js)
  backend:
    build: ./backend
    container_name: programmingroom_backend
    restart: unless-stopped
    command: npm run dev
    environment:
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      DB_NAME: ${DB_NAME:-programmingroom_db}
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - pr_network
    depends_on:
      db:
        condition: service_healthy

  # Serviço do Frontend (React/Vite Dev Server)
  frontend:
    build: ./frontend
    container_name: programmingroom_frontend
    restart: unless-stopped
    command: npm run dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - pr_network
    environment:
      - CHOKIDAR_USEPOLLING=true

networks:
  pr_network:
    driver: bridge

volumes:
  pgdata: